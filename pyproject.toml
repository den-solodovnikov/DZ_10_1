[project]
name = "dz-9-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Den Sol",email = "densfmost@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]


[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
 )/
'''


[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    'venv/',
    'tests/',
]


[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_single_line = true
length_sort = true


[tool.flake8]
max-line-length = 119
exclude =
    .venv
    .git,
    __pycache__